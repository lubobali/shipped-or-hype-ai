[project]
name = "shipped-or-hype-ai"
version = "0.1.0"
description = "Weekly AI news email where every line has a source and the AI cannot make up links"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]

[tool.pytest.ini_options]
testpaths = ["tests", "radar"]
addopts = "--doctest-modules"

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal expected values by design.
"tests/*" = ["PLR2004"]
